<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Translation from geology to a coupled-oscillator model</title>
  <desc id="desc">Five rows map physical elements of the Harrat Lunayyir intrusion to master and slave oscillators, phase, coupling strength, and the synchronization order parameter.</desc>
  <defs>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#b43612"/><stop offset="1" stop-color="#f5c842"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b8ab0"/></marker>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Transparent outer canvas: no full-size background rectangle. -->
  <text x="54" y="56" fill="#6b8ab0" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2.2">TRANSLATION LAYER</text>
  <text x="54" y="91" fill="#e2eaf8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">From a volcanic system to mathematical variables</text>

  <text x="84" y="137" fill="#f0621a" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" letter-spacing="1.2">PHYSICAL SYSTEM</text>
  <text x="704" y="137" fill="#4dd8e8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" letter-spacing="1.2">COUPLED-OSCILLATOR MODEL</text>
  <line x1="54" y1="151" x2="1146" y2="151" stroke="#1a2a40" stroke-width="2"/>

  <!-- Row backgrounds -->
  <g fill="#0c1220" stroke="#1a2a40">
    <rect x="54" y="169" width="1092" height="78" rx="10"/>
    <rect x="54" y="257" width="1092" height="78" rx="10"/>
    <rect x="54" y="345" width="1092" height="78" rx="10"/>
    <rect x="54" y="433" width="1092" height="78" rx="10"/>
    <rect x="54" y="521" width="1092" height="78" rx="10"/>
  </g>

  <!-- Left icons -->
  <g>
    <path d="M91 229 C97 213 94 195 102 181 L115 181 C111 197 117 213 111 229 Z" fill="url(#hot)" stroke="#f5c842"/>
    <path d="M103 219 L105 190" stroke="#fff3c4" stroke-width="2.5"/>

    <path d="M82 312 L105 268 L128 312" fill="#17233a" stroke="#4dd8e8" stroke-width="2"/>
    <path d="M97 312 L111 284" stroke="#4dd8e8" stroke-width="2"/>
    <path d="M89 292 L100 300 L111 291 L121 298" fill="none" stroke="#ef4444" stroke-width="2"/>

    <circle cx="105" cy="384" r="23" fill="none" stroke="#6b8ab0" stroke-width="2"/>
    <path d="M105 384 L119 370" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
    <circle cx="105" cy="384" r="4" fill="#f5c842"/>

    <path d="M77 472 C88 454 98 490 109 472 C120 454 130 490 141 472" fill="none" stroke="#4dd8e8" stroke-width="3"/>
    <path d="M78 484 C89 466 99 502 110 484 C121 466 131 502 142 484" fill="none" stroke="#f0621a" stroke-width="2" opacity="0.8"/>

    <circle cx="105" cy="560" r="27" fill="none" stroke="#223350" stroke-width="2"/>
    <g fill="#4dd8e8"><circle cx="105" cy="533" r="3"/><circle cx="121" cy="538" r="3"/><circle cx="130" cy="551" r="3"/><circle cx="131" cy="568" r="3"/><circle cx="120" cy="581" r="3"/><circle cx="104" cy="587" r="3"/><circle cx="89" cy="580" r="3"/><circle cx="79" cy="567" r="3"/><circle cx="81" cy="550" r="3"/><circle cx="90" cy="539" r="3"/></g>
    <path d="M105 560 L128 547" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Left labels -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="158" y="199" fill="#e2eaf8" font-size="18" font-weight="650">Magmatic intrusion</text>
    <text x="158" y="222" fill="#6b8ab0" font-size="13">shared forcing generated by the dyke</text>
    <text x="158" y="287" fill="#e2eaf8" font-size="18" font-weight="650">Crustal fault or segment</text>
    <text x="158" y="310" fill="#6b8ab0" font-size="13">a structure capable of a time-dependent response</text>
    <text x="158" y="375" fill="#e2eaf8" font-size="18" font-weight="650">Response timing</text>
    <text x="158" y="398" fill="#6b8ab0" font-size="13">where that structure is in its response cycle</text>
    <text x="158" y="463" fill="#e2eaf8" font-size="18" font-weight="650">Stress / fluid-pressure transfer</text>
    <text x="158" y="486" fill="#6b8ab0" font-size="13">how strongly the intrusion influences the crust</text>
    <text x="158" y="551" fill="#e2eaf8" font-size="18" font-weight="650">Collective alignment</text>
    <text x="158" y="574" fill="#6b8ab0" font-size="13">whether many responses become coordinated</text>
  </g>

  <!-- Arrows -->
  <g stroke="#6b8ab0" stroke-width="2" marker-end="url(#arr)">
    <path d="M514 208 L659 208"/><path d="M514 296 L659 296"/><path d="M514 384 L659 384"/><path d="M514 472 L659 472"/><path d="M514 560 L659 560"/>
  </g>
  <g fill="#6b8ab0" font-family="Consolas, monospace" font-size="12" text-anchor="middle">
    <text x="586" y="196">REPRESENT AS</text><text x="586" y="284">REPRESENT AS</text><text x="586" y="372">ENCODE AS</text><text x="586" y="460">ESTIMATE AS</text><text x="586" y="548">SUMMARISE AS</text>
  </g>

  <!-- Right model elements -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="735" cy="208" r="25" fill="#f0621a" opacity="0.18" stroke="#f0621a" stroke-width="2" filter="url(#glow2)"/>
    <path d="M735 208 L747 190" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
    <text x="782" y="202" fill="#e2eaf8" font-size="18" font-weight="650">Master oscillator</text>
    <text x="782" y="226" fill="#f0621a" font-family="Consolas, monospace" font-size="15">θₘ(t), ωₘ</text>

    <circle cx="735" cy="296" r="25" fill="#4dd8e8" opacity="0.12" stroke="#4dd8e8" stroke-width="2"/>
    <path d="M735 296 L722 279" stroke="#4dd8e8" stroke-width="3" stroke-linecap="round"/>
    <text x="782" y="290" fill="#e2eaf8" font-size="18" font-weight="650">Slave oscillator i</text>
    <text x="782" y="314" fill="#4dd8e8" font-family="Consolas, monospace" font-size="15">θᵢ(t), ωᵢ</text>

    <circle cx="735" cy="384" r="25" fill="none" stroke="#6b8ab0" stroke-width="2"/>
    <path d="M735 384 L753 370" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
    <text x="782" y="378" fill="#e2eaf8" font-size="18" font-weight="650">Oscillator phase</text>
    <text x="782" y="402" fill="#f5c842" font-family="Consolas, monospace" font-size="15">θᵢ ∈ [0, 2π)</text>

    <path d="M711 472 L759 472" stroke="#4dd8e8" stroke-width="3"/>
    <circle cx="711" cy="472" r="7" fill="#f0621a"/><circle cx="759" cy="472" r="7" fill="#4dd8e8"/>
    <text x="782" y="466" fill="#e2eaf8" font-size="18" font-weight="650">Coupling strength</text>
    <text x="782" y="490" fill="#4dd8e8" font-family="Consolas, monospace" font-size="15">K(x,t)</text>

    <circle cx="735" cy="560" r="26" fill="none" stroke="#223350" stroke-width="2"/>
    <g fill="#4dd8e8"><circle cx="756" cy="545" r="3.5"/><circle cx="758" cy="550" r="3.5"/><circle cx="760" cy="556" r="3.5"/><circle cx="760" cy="562" r="3.5"/><circle cx="758" cy="568" r="3.5"/><circle cx="755" cy="573" r="3.5"/></g>
    <path d="M735 560 L756 545" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
    <text x="782" y="554" fill="#e2eaf8" font-size="18" font-weight="650">Order parameter</text>
    <text x="782" y="578" fill="#4dd8e8" font-family="Consolas, monospace" font-size="15">R(t): 0 → 1</text>
  </g>

  <rect x="54" y="618" width="1092" height="37" rx="8" fill="#111827" stroke="#f5c842" stroke-width="1"/>
  <text x="600" y="642" text-anchor="middle" fill="#f5c842" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">The oscillators represent evolving structural responses—not individual earthquakes.</text>
</svg>
