<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harrat Lunayyir — Magma Sync Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #07090f; color: #e2eaf8; font-family: sans-serif; min-height: 100vh; line-height: 1.5; }
    .hero { background: #0c1220; padding: 40px 20px; text-align: center; border-bottom: 2px solid #223350; }
    .hero h1 { color: #f0621a; font-size: 1.8rem; }
    nav { background: #0c1220; padding: 10px; display: flex; gap: 20px; justify-content: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #223350; }
    nav a { color: #6b8ab0; text-decoration: none; font-size: 0.9rem; }
    section { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    canvas { background: #000; border: 1px solid #333; display: block; width: 100%; max-width: 400px; margin: 0 auto 20px; }
    .status { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; font-weight: bold; color: #f0621a; }
    .controls { text-align: center; margin-bottom: 20px; }
    button { background: #f0621a; color: #000; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; margin: 5px; }
    .slider { width: 100%; max-width: 400px; margin: 10px auto; display: block; }
    .img-box img { width: 100%; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Harrat Lunayyir — Magma Sync Model</h1>
    <p>Kuramoto Oscillator Simulation</p>
  </div>
  <nav><a href="#event">EVENT</a><a href="#sim">SIMULATION</a></nav>
  <section id="event">
    <h2>The 2009 Event</h2>
    <div class="img-box"><img src="panel_event_new.png"></div>
  </section>
  <section id="sim">
    <h2>Live Simulation</h2>
    <div class="status">
      <div id="clk">t = 0 h</div>
      <div id="sv1">r = 0.00</div>
    </div>
    <div class="controls">
      <button onclick="resetSim()">Restart</button>
      <button onclick="togglePause()" id="btnPause">Pause</button>
    </div>
    <input type="range" id="sK" min="0.01" max="1" step="0.01" value="0.15" class="slider">
    <canvas id="c1" width="400" height="400"></canvas>
    <canvas id="c2" width="400" height="400"></canvas>
    <canvas id="c3" width="400" height="400"></canvas>
  </section>

  <script>
    var t=0, th_m=0, th_c=Math.PI/4, paused=false;
    var subs = new Array(10).fill(0);

    function resetSim() { t=0; th_m=0; th_c=Math.PI/4; subs.fill(0); }
    function togglePause() { paused=!paused; document.getElementById('btnPause').textContent=paused?'Play':'Pause'; }

    function loop() {
      if(!paused) {
        var K = parseFloat(document.getElementById('sK').value);
        var om_m = 0.026, om_c = 0.028;
        var c = Math.exp(-t/1500) * (1 - Math.exp(-t/80));
        th_m += om_m;
        th_c += (om_c + K * c * Math.sin(th_m - th_c));
        t += 0.5;
        
        var r = 0.5 * Math.hypot(Math.cos(th_m)+Math.cos(th_c), Math.sin(th_m)+Math.sin(th_c));
        document.getElementById('clk').textContent = 't = ' + Math.round(t) + ' h';
        document.getElementById('sv1').textContent = 'r = ' + r.toFixed(2);

        draw();
      }
      requestAnimationFrame(loop);
    }

    function draw() {
      // Canvas 1: Master
      var cv1 = document.getElementById('c1');
      var ctx1 = cv1.getContext('2d');
      ctx1.fillStyle = 'black'; ctx1.fillRect(0,0,400,400);
      ctx1.fillStyle = '#f0621a';
      var x1 = 200 + 150 * Math.sin(th_m);
      var y1 = 200 + 150 * Math.cos(th_m);
      ctx1.beginPath(); ctx1.arc(x1, y1, 30, 0, Math.PI*2); ctx1.fill();
      ctx1.strokeStyle = 'white'; ctx1.beginPath(); ctx1.moveTo(200,50); ctx1.lineTo(x1,y1); ctx1.stroke();

      // Canvas 2: Slave
      var cv2 = document.getElementById('c2');
      var ctx2 = cv2.getContext('2d');
      ctx2.fillStyle = 'black'; ctx2.fillRect(0,0,400,400);
      ctx2.fillStyle = '#1fb8c8';
      var x2 = 200 + 150 * Math.sin(th_c);
      var y2 = 200 + 150 * Math.cos(th_c);
      ctx2.beginPath(); ctx2.arc(x2, y2, 30, 0, Math.PI*2); ctx2.fill();
      ctx2.strokeStyle = 'white'; ctx2.beginPath(); ctx2.moveTo(200,50); ctx2.lineTo(x2,y2); ctx2.stroke();

      // Canvas 3: Subsidence
      var cv3 = document.getElementById('c3');
      var ctx3 = cv3.getContext('2d');
      ctx3.fillStyle = 'black'; ctx3.fillRect(0,0,400,400);
      ctx3.fillStyle = '#f5c842';
      for(var i=0; i<10; i++) {
        var h = 20 + 50 * Math.sin(th_c + i);
        ctx3.fillRect(i*40+5, 400-h, 30, h);
      }
    }

    loop();
  </script>
</body>
</html>
