<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harrat Lunayyir — Magma Sync Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #07090f; color: #e2eaf8; font-family: sans-serif; }
    .hero { background: #0c1220; padding: 40px; text-align: center; border-bottom: 2px solid #223350; }
    .hero h1 { color: #f0621a; }
    nav { background: #0c1220; padding: 10px; display: flex; gap: 20px; justify-content: center; position: sticky; top: 0; border-bottom: 1px solid #223350; }
    nav a { color: #6b8ab0; text-decoration: none; }
    section { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    canvas { background: #000; border: 1px solid #333; display: block; width: 100%; max-width: 400px; margin: 20px auto; height: 400px; }
    .status { display: flex; gap: 20px; justify-content: center; font-weight: bold; color: #f0621a; margin: 20px; }
    button { background: #f0621a; color: #000; border: none; padding: 10px 20px; cursor: pointer; margin: 5px; }
  </style>
</head>
<body>
  <div class="hero"><h1>Harrat Lunayyir — Magma Sync Model</h1></div>
  <nav><a href="#sim">SIMULATION</a></nav>
  <section id="sim">
    <div class="status"><div id="clk">t = 0 h</div><div id="sv1">r = 0.00</div></div>
    <div style="text-align:center"><button onclick="resetSim()">Restart</button><button onclick="togglePause()" id="btnPause">Pause</button></div>
    <canvas id="c1" width="400" height="400"></canvas>
    <canvas id="c2" width="400" height="400"></canvas>
  </section>

  <script>
    var t=0, th_m=0, th_c=Math.PI/4, paused=false;
    var ctx1, ctx2;

    window.onload = function() {
      ctx1 = document.getElementById('c1').getContext('2d');
      ctx2 = document.getElementById('c2').getContext('2d');
      loop();
    };

    function resetSim() { t=0; th_m=0; th_c=Math.PI/4; }
    function togglePause() { paused=!paused; document.getElementById('btnPause').textContent=paused?'Play':'Pause'; }

    function loop() {
      if(!paused) {
        th_m += 0.026;
        th_c += (0.028 + 0.15 * Math.sin(th_m - th_c));
        t += 0.5;
        document.getElementById('clk').textContent = 't = ' + Math.round(t) + ' h';
        document.getElementById('sv1').textContent = 'r = ' + (0.5 * Math.hypot(Math.cos(th_m)+Math.cos(th_c), Math.sin(th_m)+Math.sin(th_c))).toFixed(2);
      }
      
      if(ctx1 && ctx2) {
        ctx1.fillStyle = 'black'; ctx1.fillRect(0,0,400,400);
        ctx1.fillStyle = 'orange';
        ctx1.beginPath(); ctx1.arc(200 + 100*Math.sin(th_m), 200 + 100*Math.cos(th_m), 40, 0, Math.PI*2); ctx1.fill();

        ctx2.fillStyle = 'black'; ctx2.fillRect(0,0,400,400);
        ctx2.fillStyle = 'cyan';
        ctx2.beginPath(); ctx2.arc(200 + 100*Math.sin(th_c), 200 + 100*Math.cos(th_c), 40, 0, Math.PI*2); ctx2.fill();
      }
      
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
